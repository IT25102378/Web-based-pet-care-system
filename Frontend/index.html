<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230F766E'/><g transform='translate(50,48)' fill='white'><ellipse cx='-14' cy='-14' rx='7' ry='9' transform='rotate(-15)'/><ellipse cx='14' cy='-14' rx='7' ry='9' transform='rotate(15)'/><ellipse cx='-24' cy='2' rx='6' ry='8' transform='rotate(-30)'/><ellipse cx='24' cy='2' rx='6' ry='8' transform='rotate(30)'/><ellipse cx='0' cy='14' rx='16' ry='13'/></g></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Nexus | Modern Veterinary & Pet Care Management</title>
    <meta name="description" content="Pet Nexus - Integrated Veterinary Clinic, Pet Health, Adoption & Rescue Management System" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#0F766E" />
    <script>
      window.__petnexus_startup_errors = [];
      window.addEventListener('error', function(e) {
        window.__petnexus_startup_errors.push(e.message || String(e));
        var root = document.getElementById('root');
        if (root && (!root.children.length || root.innerHTML.trim() === '')) {
          root.innerHTML = '<div style="padding:2.5rem;margin:2rem auto;max-width:680px;background:#FEF2F2;border:1.5px solid #EF4444;border-radius:12px;font-family:system-ui,sans-serif;color:#991B1B;"><h3 style="margin:0 0 10px;font-size:1.15rem;">Startup Error Detected</h3><p style="margin:0 0 12px;font-size:0.92rem;">' + (e.message || 'Script execution error') + '</p><pre style="margin:0;padding:12px;background:#FFF;border-radius:6px;font-size:0.8rem;overflow:auto;max-height:220px;border:1px solid #FCA5A5;">' + (e.error && e.error.stack ? e.error.stack : (e.filename + ':' + e.lineno + ':' + e.colno)) + '</pre><div style="margin-top:16px;"><button onclick="window.location.reload()" style="padding:8px 16px;background:#EF4444;color:#FFF;border:none;border-radius:6px;cursor:pointer;font-weight:600;">Reload Page</button></div></div>';
        }
      });
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding:2.5rem;margin:2rem auto;max-width:600px;background:#FFF;border-radius:12px;border:1px solid #E2E8F0;font-family:system-ui,sans-serif;text-align:center;">
        <h2 style="color:#0F766E;">JavaScript Required</h2>
        <p style="color:#64748B;">Pet Nexus requires JavaScript to run. If using Brave Browser, please ensure Brave Shields has not blocked scripts on localhost:3000.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
