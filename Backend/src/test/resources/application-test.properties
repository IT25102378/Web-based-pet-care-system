# ============================================================
# Test configuration.
# Tests MUST run against PetNexus_Test, never the PetNexus
# database the application uses. Activated by @ActiveProfiles("test")
# on every test class.
# ============================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=PetNexus_Test;encrypt=true;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.mvc.servlet.path=/api

logging.level.com.petnexus=INFO
