spring.application.name=backend-test
server.port=8080

# ============================================================
# Centralized PetNexus SQL Server Database (Test Configuration)
# ============================================================
spring.datasource.url=${TEST_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=PetNexus;integratedSecurity=true;encrypt=true;trustServerCertificate=true}
spring.mvc.servlet.path=/api

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# SQL Initialization
spring.sql.init.mode=never

# Logging
logging.level.com.petnexus=INFO

# Test JWT Security
petnexus.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
petnexus.jwt.expiration-ms=86400000

# Mail & Frontend URL
spring.mail.host=localhost
spring.mail.port=25
petnexus.frontend.url=http://localhost:3000
