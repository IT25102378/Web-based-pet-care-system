spring.application.name=backend
server.port=8080

# ============================================================
# Centralized PetNexus SQL Server Database
# All modules (users, pets, appointments, rescue, adoption,
# inventory, suppliers, consultations, feedback, notifications)
# MUST use this single database. Do NOT create separate DBs.
# ============================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=PetNexus;encrypt=true;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# API base path — all controllers are served under /api/*
spring.mvc.servlet.path=/api

# Logging
logging.level.com.petnexus=DEBUG

# ============================================================
# JWT Security Settings (Phase 10A)
# ============================================================
petnexus.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
petnexus.jwt.expiration-ms=86400000

# ============================================================
# Email / SMTP Settings
# Set these environment variables before running:
#   MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD
# Defaults to Gmail SMTP port 587 with STARTTLS.
# If credentials are not set, email sending fails gracefully
# in UserService without blocking user registration.
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Frontend base URL — used to build the verification link in emails
petnexus.frontend.url=${FRONTEND_URL:http://localhost:3000}